# 腾讯云服务器上运行的 Dawnshard。
# deploy.sh 部署时会把它写到服务器的 /opt/dawnshard/docker-compose.yml，
# 并把 __DRAGALIA_API_IMAGE__ 换成这次要运行的镜像。
# 数据库密码、DEVELOPER_TOKEN 等放在服务器的 /opt/dawnshard/.env，不进仓库。
# 服务名和数据卷名不要改：服务器上现有的数据库就在 dawnshard_pgdata 这个卷里。
name: dawnshard

volumes:
  pgdata:

services:
  dragaliaapi:
    image: __DRAGALIA_API_IMAGE__
    environment:
      - ConnectionStrings__Postgres=Host=postgres;User ID=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
      - ConnectionStrings__Redis=redis
    env_file:
      - .env
    volumes:
      # 私服配置，替换镜像里自带的同名文件：活动安排等 / 卡池
      - ./appsettings.Production.json:/app/appsettings.Production.json:ro
      - ./bannerConfig.json:/app/Resources/bannerConfig.json:ro
      - ./guest-auth/private/api.json:/app/guestauth-api.runtime.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  guestauth:
    profiles: [guest-auth]
    image: __DRAGALIA_API_IMAGE__
    entrypoint: [dotnet, /guestauth/GuestAuth.dll]
    environment:
      ASPNETCORE_URLS: http://+:8080
      GuestAuthRuntimeFile: /run/guestauth/runtime.json
    volumes:
      - ./guest-auth/private/runtime.json:/run/guestauth/runtime.json:ro
      - ./guest-auth/data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: [CMD, dotnet, /guestauth/GuestAuth.dll, --health-check]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  guest-auth-edge:
    profiles: [guest-auth]
    image: __DRAGALIA_API_IMAGE__
    entrypoint: [/usr/bin/caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    env_file: [./guest-auth/private/edge.env]
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
      NO_PROXY: dragaliaapi,guestauth,localhost,127.0.0.1,::1
      no_proxy: dragaliaapi,guestauth,localhost,127.0.0.1,::1
    volumes:
      - ./guest-auth/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./guest-auth/caddy:/data
    ports: ["80:8080", "443:8443"]
    read_only: true
    tmpfs: [/tmp, /config]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped

  postgres:
    hostname: postgres
    image: postgres:17
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    hostname: redis
    image: redis:8
    restart: unless-stopped
