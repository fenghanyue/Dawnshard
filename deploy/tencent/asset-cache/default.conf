# 资源缓存：手机下载游戏资源走这里（服务器 8081 端口），缓存里没有的再去资源站 cdn.minty.sbs 取。
# deploy.sh 部署时写到服务器的 /opt/asset-cache/default.conf，有变化就让 nginx 重新加载。
# 改过活动日期的数据表和资源清单（../client-master/client_master.py 生成）放在 /srv/overrides，先从那里找。

upstream minty_cdn {
    server cdn.minty.sbs:443;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx/assets levels=1:2 keys_zone=assets:64m max_size=30g min_free=5g inactive=365d use_temp_path=off;

log_format cachelog '$remote_addr [$time_local] "$request" $status $body_bytes_sent cache=$upstream_cache_status rt=$request_time token=$http_reliable_token';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log cachelog;

    # 游戏请求带 reliable_token 请求头，nginx 默认会丢弃带下划线的请求头
    underscores_in_headers on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host cdn.minty.sbs;
    proxy_set_header Accept-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_name cdn.minty.sbs;
    proxy_ssl_verify on;                                              # 上游证书校验
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt; # 上游证书校验
    proxy_ssl_verify_depth 3;                                         # 上游证书校验
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;

    proxy_cache assets;
    proxy_cache_key $uri$is_args$args;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 120s;
    proxy_cache_lock_age 120s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always;

    location /dl/assetbundles/ {
        limit_except GET { deny all; }
        root /srv/overrides;
        try_files $uri @cdn_assetbundles;
    }

    # 改写后的路径就是缓存的键，和以前一样，已经缓存的文件照样能用
    location @cdn_assetbundles {
        rewrite ^/dl/assetbundles/Android/(.*)$ /dl/assetbundles/universe/$1 break;
        proxy_cache_valid 200 365d;
        proxy_pass https://minty_cdn;
    }

    location /dl/manifests/ {
        limit_except GET { deny all; }
        root /srv/overrides;
        try_files $uri @cdn_manifests;
    }

    location @cdn_manifests {
        rewrite ^/dl/manifests/Android/(.*)$ /dl/manifests/universe/$1 break;
        proxy_cache_valid 200 10m;
        proxy_cache_background_update on;
        proxy_pass https://minty_cdn;
    }

    location /dl/ {
        limit_except GET { deny all; }
        rewrite ^/dl/(.*)/Android/(.*)$ /dl/$1/universe/$2 break;
        proxy_cache_valid 200 10m;
        proxy_pass https://minty_cdn;
    }

    location /speedtest/ {
        root /srv;
    }

    location / {
        return 404;
    }
}
