name: Check Tencent deployment

on:
  pull_request:
    paths:
      - deploy/tencent/**
      - GuestAuth/**
      - DragaliaAPI/DragaliaAPI/Dockerfile
      - tools/tencent/**
      - PhotonStateManager/**
      - PhotonPlugin/DragaliaAPI.Photon.Plugin/Plugins/GameLogic/**
      - .github/workflows/tencent-deploy*.yaml
      - "!**/*.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check scripts and deployment behavior
        run: |
          bash -n deploy/tencent/deploy.sh deploy/tencent/photon/manage.sh deploy/tencent/photon/smoke.sh deploy/tencent/photon/smoke-rooms.sh deploy/tencent/photon/rooms/entrypoint.sh deploy/tencent/photon/rooms/fetch-source.sh
          python3 -m unittest discover -s deploy/tencent -p 'test_*.py' -v
          python3 -m unittest discover -s tools/tencent -v
          python3 deploy/tencent/check_config.py
          python3 deploy/tencent/tat_run.py --image ghcr.io/example/dragalia-api:test --print-script > /dev/null

      - uses: docker/setup-buildx-action@v4

      - name: Build game and guest authentication production image
        run: docker build -f DragaliaAPI/DragaliaAPI/Dockerfile -t dawnshard-guest:checks .

      - name: Verify TLS gateway, persistent guest identity and game login
        run: |
          python3 -m pip install --quiet msgpack==1.1.2
          python3 deploy/tencent/guest-auth/smoke.py dawnshard-guest:checks

      - name: Build fixed Luxon release
        run: docker build -t dawnshard-luxon:trial deploy/tencent/photon

      - name: Run Luxon as non-root with the deployment configuration
        run: bash deploy/tencent/photon/smoke.sh dawnshard-luxon:trial

      - name: Build room plugin and protocol verification client
        run: |
          docker build -f deploy/tencent/photon/Dockerfile.rooms --target final -t dawnshard-luxon:rooms .
          docker build -f deploy/tencent/photon/Dockerfile.rooms --target verification -t dawnshard-luxon:checks .

      - name: Verify encrypted UDP rooms, battle protocol and result bridge with Redis 8
        run: bash deploy/tencent/photon/smoke-rooms.sh dawnshard-luxon:rooms dawnshard-luxon:checks
